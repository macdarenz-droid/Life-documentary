name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm boundaries
      - run: pnpm test
      - run: pnpm --filter @life/api deploy:dry

  render:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Chrome Headless Shell libraries (Remotion Linux dependencies)
        run: >-
          sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0
          libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev
          libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @life/render exec remotion browser ensure
      - name: Render fixture episode
        run: pnpm --filter @life/render render:fixture
      - uses: actions/upload-artifact@v7
        with:
          name: fixture-episode
          path: packages/render/out/fixture.mp4
          retention-days: 7
          if-no-files-found: error

  lab:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Export the web build
        run: pnpm --filter @life/mobile export:web
      - name: Record the Design Lab
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: design-lab-video
          path: test-results/**/video.webm
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: design-lab-report
          path: playwright-report/
          retention-days: 7
